name: Validacao tecnica experimental
on:
  push:
    branches: [feature/validador-clinico-v1]
  pull_request:
    branches: [main]
jobs:
  testes-e-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
